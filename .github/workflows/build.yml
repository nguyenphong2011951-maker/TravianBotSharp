name: Build TravianBotSharp Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Find UI Project and Publish
      shell: pwsh
      run: |
        $proj = Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.Name -notmatch "MainCore|Test|Module|Common|Core" } | Select-Object -First 1
        Write-Host "Found UI Project: $($proj.FullName)"
        dotnet publish $proj.FullName -c Release -r win-x64 --self-contained false -o ./publish_output

    - name: Upload TBS Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TravianBotSharp-Custom-Tampermonkey
        path: ./publish_output/
